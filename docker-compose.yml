version: '3.8'
services:
  app:
    image: directus/directus:latest
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - BRAND_NAME=ICARE PRO LABS
      - PRIMARY_COLOR=#2563EB
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bmad
      - POSTGRES_PASSWORD=bmad_secret
      - POSTGRES_DB=tpl_serp_repair_tracker
